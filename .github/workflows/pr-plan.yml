name: TBDP-BI Terraform PR Plan

on:
  pull_request:
    branches:
      - main

concurrency:
  group: tbdp-bi-dev-terraform
  cancel-in-progress: false

jobs:
  terraform-pr-plan:
    name: Terraform PR Plan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the Pull Request
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Terraform on the GitHub runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      # Step 3: Authenticate GitHub Actions with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 4: Initialize Terraform, provider, modules and S3 backend
      - name: Terraform Init
        run: terraform init

      # Step 5: Verify Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Step 6: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -no-color
